name: Live Matrix smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  smoke:
    name: Live Matrix authenticated smoke
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'live-smoke'))
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate live smoke secrets
        env:
          LIVE_MATRIX_SERVER: ${{ secrets.LIVE_MATRIX_SERVER }}
          LIVE_MATRIX_USERNAME: ${{ secrets.LIVE_MATRIX_USERNAME }}
          LIVE_MATRIX_PASSWORD: ${{ secrets.LIVE_MATRIX_PASSWORD }}
          LIVE_MATRIX_RECOVERY_KEY: ${{ secrets.LIVE_MATRIX_RECOVERY_KEY }}
        shell: bash
        run: |
          missing=0
          for key in LIVE_MATRIX_SERVER LIVE_MATRIX_USERNAME LIVE_MATRIX_PASSWORD LIVE_MATRIX_RECOVERY_KEY; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing required secret: $key"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Setup app
        uses: ./.github/actions/setup

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run live Matrix authenticated smoke
        env:
          LIVE_MATRIX_SERVER: ${{ secrets.LIVE_MATRIX_SERVER }}
          LIVE_MATRIX_USERNAME: ${{ secrets.LIVE_MATRIX_USERNAME }}
          LIVE_MATRIX_PASSWORD: ${{ secrets.LIVE_MATRIX_PASSWORD }}
          LIVE_MATRIX_RECOVERY_KEY: ${{ secrets.LIVE_MATRIX_RECOVERY_KEY }}
          LIVE_MATRIX_ROOM_ID: '!mxyMeeQ8S0qXUqcCkgBei4cnb4grSEwIaK1sQxzAvpM'
          LIVE_MATRIX_ROOM_NAME: Test
          PLAYWRIGHT_TRACE: off
        run: pnpm run test:e2e:live

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-matrix-playwright-report
          path: playwright-report
          if-no-files-found: ignore
